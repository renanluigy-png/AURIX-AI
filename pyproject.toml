[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aurix-ai"
version = "0.1.0"
description = "A voice-activated personal AI assistant for Windows."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { file = "LICENSE" }
authors = [{ name = "Luigy Renan" }]
dependencies = [
    "PySide6>=6.7,<7",
    "openwakeword>=0.6.0,<1",
    "sounddevice>=0.4.6,<1",
    "numpy>=1.24,<2",
    "SpeechRecognition>=3.10,<4",
    "pyttsx3>=2.90,<3",
    "python-dotenv>=1.0,<2",
    "openai>=1.68,<3",
    "pynput>=1.7.7,<2",
]

[project.optional-dependencies]
offline-speech = ["vosk>=0.3.45,<1"]
dev = ["pytest>=8,<9"]

[project.scripts]
aurix = "aurix.app:main"

[tool.setuptools.packages.find]
include = ["aurix*"]
