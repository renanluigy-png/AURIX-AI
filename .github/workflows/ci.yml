name: Python and Windows package checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Avoid wasting Windows runners on superseded commits in the same PR/branch.
concurrency:
  group: aurix-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install configuration test dependency
        run: python -m pip install python-dotenv
      - name: Compile Python files
        run: python -m compileall -q aurix tests
      - name: Unit tests
        run: python -m unittest discover -s tests -v

  windows-build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install application and packager
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pyinstaller pyinstaller-hooks-contrib

      - name: Smoke test Brazilian Portuguese neural voice
        shell: pwsh
        run: |
          @'
          import tempfile
          import wave
          from pathlib import Path
          from aurix.speech import synthesize_to_wav

          target = Path(tempfile.gettempdir()) / "aurix-voice-smoke-test.wav"
          synthesize_to_wav("Olá! Eu sou a AURIX. Estou funcionando localmente.", target)
          with wave.open(str(target), "rb") as generated:
              assert generated.getnframes() > 0, "O Kokoro não gerou áudio."
              assert generated.getframerate() == 24000, "Taxa de amostragem inesperada."
              assert generated.getnchannels() == 1, "O áudio precisa ser mono."
          target.unlink(missing_ok=True)
          print("Kokoro pt-BR: síntese neural local concluída.")
          '@ | Set-Content -Encoding utf8 smoke_voice.py
          python smoke_voice.py

      - name: Build self-contained Windows executable
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name AURIX-AI --collect-all PySide6 --collect-all openwakeword --collect-all onnxruntime --collect-all keyring --collect-all vosk --collect-all pynput --collect-all pyttsx3 --collect-all tugaphone --collect-all SpeechRecognition --hidden-import=pyttsx3.drivers.sapi5 --hidden-import=tugaphone --hidden-import=keyring.backends.Windows --hidden-import=onnxruntime run_aurix.py
          if (-not (Test-Path "dist/AURIX-AI.exe")) { throw "O executável do AURIX não foi gerado." }

      - name: Install MSIX asset generator
        run: python -m pip install pillow

      - name: Build and validate Microsoft Store MSIX package
        shell: pwsh
        env:
          AURIX_MSIX_IDENTITY_NAME: ${{ vars.AURIX_MSIX_IDENTITY_NAME }}
          AURIX_MSIX_PUBLISHER: ${{ vars.AURIX_MSIX_PUBLISHER }}
          AURIX_MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.AURIX_MSIX_PUBLISHER_DISPLAY_NAME }}
        run: |
          $buildText = Get-Content "aurix/build_info.py" -Raw
          $versionMatch = [regex]::Match($buildText, 'APP_VERSION\s*=\s*"([^"]+)"')
          if (-not $versionMatch.Success) { throw "APP_VERSION não foi encontrado." }
          $versionParts = @($versionMatch.Groups[1].Value.Split('.'))
          while ($versionParts.Count -lt 4) { $versionParts += "0" }
          $msixVersion = ($versionParts | Select-Object -First 4) -join "."
          & .\packaging\msix\build-msix.ps1 -ExecutablePath "dist\AURIX-AI.exe" -OutputPath "dist-msix\AURIX-AI.msix" -Version $msixVersion
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path "dist-msix\AURIX-AI.msix")) { throw "O pacote MSIX não foi criado." }

      - name: Upload Microsoft Store MSIX candidate
        uses: actions/upload-artifact@v4
        with:
          name: AURIX-AI-MSIX-Store-Package
          path: dist-msix/AURIX-AI.msix
          if-no-files-found: error
          retention-days: 14
