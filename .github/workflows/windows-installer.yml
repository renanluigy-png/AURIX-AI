name: Windows app installer

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: aurix-windows-installer
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-installer:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install application and packager
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pyinstaller pyinstaller-hooks-contrib

      - name: Build self-contained Windows executable
        run: >
          python -m PyInstaller --noconfirm --clean --onedir --contents-directory . --windowed
          --name AURIX-AI
          --collect-all PySide6
          --collect-all openwakeword
          --collect-all onnxruntime
          --collect-all keyring
          --collect-all vosk
          --collect-all pynput
          --collect-all pyttsx3
          --collect-all SpeechRecognition
          --hidden-import=pyttsx3.drivers.sapi5
          --hidden-import=keyring.backends.Windows
          --hidden-import=onnxruntime
          run_aurix.py

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          $programFilesX86 = [Environment]::GetEnvironmentVariable('ProgramFiles(x86)')
          $iscc = Join-Path $programFilesX86 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            throw "Inno Setup compiler not found at $iscc"
          }
          & $iscc installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path "dist-installer\AURIX-AI-Setup.exe")) {
            throw "Installer file was not created."
          }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: AURIX-AI-Installer
          path: dist-installer/AURIX-AI-Setup.exe
          if-no-files-found: error
          retention-days: 30
