name: Windows MSIX Store Package

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: aurix-windows-msix
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-msix:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set package version
        shell: pwsh
        run: |
          $version = "0.4.$($env:GITHUB_RUN_NUMBER).0"
          $buildInfo = 'APP_VERSION = "' + $version + '"' + [Environment]::NewLine
          [System.IO.File]::WriteAllText("aurix/build_info.py", $buildInfo, [System.Text.UTF8Encoding]::new($false))
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install application and build tools
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pyinstaller pyinstaller-hooks-contrib pillow

      - name: Build self-contained Windows application
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name AURIX-AI --collect-all PySide6 --collect-all openwakeword --collect-all onnxruntime --collect-all keyring --collect-all vosk --collect-all pynput --collect-all pyttsx3 --collect-all tugaphone --collect-all SpeechRecognition --hidden-import=pyttsx3.drivers.sapi5 --hidden-import=tugaphone --hidden-import=keyring.backends.Windows --hidden-import=onnxruntime run_aurix.py
          if (-not (Test-Path "dist/AURIX-AI.exe")) { throw "O executável do AURIX não foi gerado." }

      - name: Build and validate MSIX package
        shell: pwsh
        env:
          AURIX_MSIX_IDENTITY_NAME: ${{ vars.AURIX_MSIX_IDENTITY_NAME }}
          AURIX_MSIX_PUBLISHER: ${{ vars.AURIX_MSIX_PUBLISHER }}
          AURIX_MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.AURIX_MSIX_PUBLISHER_DISPLAY_NAME }}
        run: |
          & .\packaging\msix\build-msix.ps1 -ExecutablePath "dist\AURIX-AI.exe" -OutputPath "dist-msix\AURIX-AI.msix" -Version $version
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path "dist-msix\AURIX-AI.msix")) { throw "O pacote MSIX não foi criado." }

      - name: Upload Microsoft Store package candidate
        uses: actions/upload-artifact@v4
        with:
          name: AURIX-AI-MSIX-Store-Package
          path: dist-msix/AURIX-AI.msix
          if-no-files-found: error
          retention-days: 30
